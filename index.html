<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Transcriber & Summarizer</title>
    <style>
        :root {
            --bg-color: #0f172a;          /* Deep slate background */
            --card-bg: #1e293b;           /* Elevated container slate */
            --border-color: #334155;      /* Subtle border contrast */
            --border-hover: #475569;
            --text-primary: #f8fafc;      /* Bright white for readability */
            --text-secondary: #94a3b8;    /* Muted slate text */
            --accent: #38bdf8;            /* Vibrant sky blue */
            --success: #10b981;           /* Emerald green */
            --danger: #f43f5e;            /* Modern rose/red */
            --btn-secondary: #334155;
            --btn-secondary-hover: #475569;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 32px 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        h2 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-bar {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            background: rgba(15, 23, 42, 0.6);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            word-break: break-word;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls {
            display: flex;
            gap: 12px;
        }

        button {
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        #startBtn {
            flex: 1;
            background-color: var(--success);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }

        #startBtn:hover:not(:disabled) {
            background-color: #059669;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.35);
        }

        #stopBtn {
            flex: 1;
            background-color: var(--danger);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.25);
        }

        #stopBtn:hover:not(:disabled) {
            background-color: #e11d48;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(244, 63, 94, 0.35);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
        }

        .section-title {
            color: var(--accent);
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background-color: var(--btn-secondary);
            color: var(--text-primary);
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: 500;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .action-btn:hover:not(:disabled) {
            background-color: var(--btn-secondary-hover);
            border-color: var(--border-hover);
        }

        .box {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            min-height: 120px;
            max-height: 240px;
            overflow-y: auto;
            font-family: inherit;
            color: var(--text-primary);
            white-space: pre-wrap;
            line-height: 1.65;
            font-size: 0.925rem;
            transition: border-color 0.2s ease;
        }

        .box:focus-within, .box:hover {
            border-color: var(--border-hover);
        }

        /* Custom Scrollbar */
        .box::-webkit-scrollbar {
            width: 6px;
        }
        .box::-webkit-scrollbar-track {
            background: transparent;
        }
        .box::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Voice Transcriber & Summarizer</h2>
    
    <div id="status" class="status-bar">Status: Ready to record</div>

    <div class="controls">
        <button id="startBtn">Start Recording</button>
        <button id="stopBtn" disabled>Stop & Process</button>
    </div>

    <!-- Full Transcript Section -->
    <div class="section-header">
        <div class="section-title">Full Transcript</div>
        <div class="action-btns">
            <button id="copyTranscriptBtn" class="action-btn">Copy</button>
        </div>
    </div>
    <div id="transcriptBox" class="box">Your transcribed text will appear here...</div>

    <!-- Key Pointers Section -->
    <div class="section-header">
        <div class="section-title">Key Pointers & Action Items</div>
        <div class="action-btns">
            <button id="copySummaryBtn" class="action-btn">Copy</button>
            <button id="emailSummaryBtn" class="action-btn">Email Summary</button>
        </div>
    </div>
    <div id="summaryBox" class="box">Important summary points will be generated automatically...</div>
</div>

<script>
    // Live Cloudflare Worker Proxy URL
    const PROXY_URL = 'https://groq-audio-proxy.utsavchs.workers.dev';

    let mediaRecorder;
    let audioChunks = [];

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusEl = document.getElementById('status');
    const transcriptBox = document.getElementById('transcriptBox');
    const summaryBox = document.getElementById('summaryBox');

    const copyTranscriptBtn = document.getElementById('copyTranscriptBtn');
    const copySummaryBtn = document.getElementById('copySummaryBtn');
    const emailSummaryBtn = document.getElementById('emailSummaryBtn');

    // Helper: Copy Text to Clipboard
    async function copyToClipboard(text, buttonEl) {
        if (!text || text.includes('will appear here')) return;
        try {
            await navigator.clipboard.writeText(text);
            const originalText = buttonEl.textContent;
            buttonEl.textContent = 'Copied!';
            setTimeout(() => buttonEl.textContent = originalText, 2000);
        } catch (err) {
            console.error('Copy failed:', err);
        }
    }

    // Copy Event Handlers
    copyTranscriptBtn.addEventListener('click', () => {
        copyToClipboard(transcriptBox.textContent, copyTranscriptBtn);
    });

    copySummaryBtn.addEventListener('click', () => {
        copyToClipboard(summaryBox.textContent, copySummaryBtn);
    });

    // Email Summary Handler
    emailSummaryBtn.addEventListener('click', () => {
        const text = summaryBox.textContent;
        if (!text || text.includes('generated automatically')) return;

        const subject = encodeURIComponent("Meeting Key Pointers & Action Items");
        const body = encodeURIComponent(text);
        window.location.href = `mailto:?subject=${subject}&body=${body}`;
    });

    // 1. Start Recording
    startBtn.addEventListener('click', async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) audioChunks.push(e.data);
            };

            mediaRecorder.start();

            statusEl.textContent = "Status: Recording... Speak clearly (100% audio captured)";
            startBtn.disabled = true;
            stopBtn.disabled = false;
        } catch (err) {
            statusEl.textContent = `Microphone Error: ${err.message}`;
        }
    });

    // 2. Stop Recording & Trigger Processing
    stopBtn.addEventListener('click', () => {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());

        startBtn.disabled = false;
        stopBtn.disabled = true;
        statusEl.textContent = "Status: Processing audio via Proxy...";

        mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/m4a' });
            await processAudio(audioBlob);
        };
    });

    // 3. Process via Cloudflare Worker
    async function processAudio(audioBlob) {
        const formData = new FormData();
        formData.append('file', audioBlob, 'speech.m4a');

        try {
            // Step A: Transcribe
            statusEl.textContent = "Status: Transcribing speech...";
            const whisperRes = await fetch(`${PROXY_URL}/transcribe`, {
                method: 'POST',
                body: formData
            });

            const whisperData = await whisperRes.json();
            
            if (!whisperRes.ok || whisperData.error) {
                const errDetail = typeof whisperData.error === 'object' 
                    ? JSON.stringify(whisperData.error) 
                    : (whisperData.error || 'Transcription request failed');
                throw new Error(errDetail);
            }

            const transcriptText = whisperData.text || "No speech detected.";
            transcriptBox.textContent = transcriptText;

            // Step B: Summarize
            statusEl.textContent = "Status: Extracting key pointers...";
            const summaryRes = await fetch(`${PROXY_URL}/summarize`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: transcriptText })
            });

            const summaryData = await summaryRes.json();
            
            if (!summaryRes.ok || summaryData.error) {
                const errDetail = typeof summaryData.error === 'object' 
                    ? JSON.stringify(summaryData.error) 
                    : (summaryData.error || 'Summarization request failed');
                throw new Error(errDetail);
            }

            summaryBox.textContent = summaryData.choices[0].message.content;
            statusEl.textContent = "Status: Complete!";

        } catch (err) {
            statusEl.textContent = `Error: ${err.message}`;
            console.error("Processing Error:", err);
        }
    }
</script>

</body>
</html>
