<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Transcriber & Summarizer</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --border-color: #334155;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent: #60a5fa;
            --success: #16a34a;
            --danger: #dc2626;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        h2 {
            margin: 0 0 5px 0;
            color: var(--text-primary);
        }

        .status-bar {
            font-size: 0.9rem;
            color: var(--text-secondary);
            background: var(--card-bg);
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            word-break: break-word;
        }

        .controls {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #startBtn {
            background-color: var(--success);
            color: white;
        }

        #stopBtn {
            background-color: var(--danger);
            color: white;
        }

        .section-title {
            margin: 10px 0 5px 0;
            color: var(--accent);
            font-size: 1.1rem;
        }

        .box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            min-height: 120px;
            max-height: 250px;
            overflow-y: auto;
            font-family: monospace;
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Voice Transcriber & Summarizer</h2>
    
    <div id="status" class="status-bar">Status: Ready to record</div>

    <div class="controls">
        <button id="startBtn">Start Recording</button>
        <button id="stopBtn" disabled>Stop & Process</button>
    </div>

    <div class="section-title">Full Transcript (100% Captured)</div>
    <div id="transcriptBox" class="box">Your transcribed text will appear here...</div>

    <div class="section-title">Key Pointers & Action Items</div>
    <div id="summaryBox" class="box">Important summary points will be generated automatically...</div>
</div>

<script>
    // Live Cloudflare Worker Proxy URL
    const PROXY_URL = 'https://groq-audio-proxy.utsavchs.workers.dev';

    let mediaRecorder;
    let audioChunks = [];

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusEl = document.getElementById('status');
    const transcriptBox = document.getElementById('transcriptBox');
    const summaryBox = document.getElementById('summaryBox');

    // 1. Start Recording
    startBtn.addEventListener('click', async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) audioChunks.push(e.data);
            };

            mediaRecorder.start();

            statusEl.textContent = "Status: Recording... Speak clearly (100% audio captured)";
            startBtn.disabled = true;
            stopBtn.disabled = false;
        } catch (err) {
            statusEl.textContent = `Microphone Error: ${err.message}`;
        }
    });

    // 2. Stop Recording & Trigger Processing
    stopBtn.addEventListener('click', () => {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());

        startBtn.disabled = false;
        stopBtn.disabled = true;
        statusEl.textContent = "Status: Processing audio via Proxy...";

        mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/m4a' });
            await processAudio(audioBlob);
        };
    });

    // 3. Process via Cloudflare Worker
    async function processAudio(audioBlob) {
        const formData = new FormData();
        formData.append('file', audioBlob, 'speech.m4a');

        try {
            // Step A: Transcribe
            statusEl.textContent = "Status: Transcribing speech...";
            const whisperRes = await fetch(`${PROXY_URL}/transcribe`, {
                method: 'POST',
                body: formData
            });

            const whisperData = await whisperRes.json();
            
            if (!whisperRes.ok || whisperData.error) {
                const errDetail = typeof whisperData.error === 'object' 
                    ? JSON.stringify(whisperData.error) 
                    : (whisperData.error || 'Transcription request failed');
                throw new Error(errDetail);
            }

            const transcriptText = whisperData.text || "No speech detected.";
            transcriptBox.textContent = transcriptText;

            // Step B: Summarize
            statusEl.textContent = "Status: Extracting key pointers...";
            const summaryRes = await fetch(`${PROXY_URL}/summarize`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: transcriptText })
            });

            const summaryData = await summaryRes.json();
            
            if (!summaryRes.ok || summaryData.error) {
                const errDetail = typeof summaryData.error === 'object' 
                    ? JSON.stringify(summaryData.error) 
                    : (summaryData.error || 'Summarization request failed');
                throw new Error(errDetail);
            }

            summaryBox.textContent = summaryData.choices[0].message.content;
            statusEl.textContent = "Status: Complete!";

        } catch (err) {
            statusEl.textContent = `Error: ${err.message}`;
            console.error("Processing Error:", err);
        }
    }
</script>

</body>
</html>
