<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Fast Transcriber</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #e2e8f0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 600px; }
        .controls { display: flex; gap: 10px; margin-bottom: 15px; }
        button {
            flex: 1; padding: 12px; font-size: 1rem; font-weight: bold;
            border: none; border-radius: 6px; cursor: pointer;
        }
        #startBtn { background: #16a34a; color: white; }
        #stopBtn { background: #dc2626; color: white; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .box {
            background: #1e1e1e; border: 1px solid #334155;
            border-radius: 8px; padding: 15px; height: 300px;
            overflow-y: auto; font-family: monospace; white-space: pre-wrap;
            font-size: 1.1rem; line-height: 1.6;
        }
        #status { font-size: 0.9rem; color: #94a3b8; margin-bottom: 10px; }
        .select-group { margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        select { padding: 8px; background: #1e1e1e; color: #e2e8f0; border: 1px solid #334155; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Fast Live Speech-to-Text</h2>
    
    <div class="select-group">
        <label for="langSelect">Speaking Language Mode:</label>
        <select id="langSelect">
            <option value="en-IN" selected>English / Hinglish (en-IN)</option>
            <option value="en-US">English Only (en-US)</option>
            <option value="hi-IN">Pure Hindi (hi-IN)</option>
        </select>
    </div>

    <div id="status">Status: Idle</div>

    <div class="controls">
        <button id="startBtn">Start Listening</button>
        <button id="stopBtn" disabled>Stop</button>
    </div>

    <div id="output" class="box">Transcribed text will appear here instantly...</div>
</div>

<script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const outputEl = document.getElementById('output');
    const statusEl = document.getElementById('status');
    const langSelect = document.getElementById('langSelect');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        statusEl.textContent = "Error: Use Chrome or Edge for Speech Recognition.";
        startBtn.disabled = true;
    } else {
        const recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = () => {
            statusEl.textContent = `Status: Listening in ${langSelect.options[langSelect.selectedIndex].text}...`;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            langSelect.disabled = true;
        };

        recognition.onresult = (event) => {
            let interimScript = '';
            let finalScript = '';

            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalScript += event.results[i][0].transcript + ' ';
                } else {
                    interimScript += event.results[i][0].transcript;
                }
            }

            if (finalScript.length > 0) {
                if (outputEl.textContent.includes("Transcribed text will appear")) outputEl.textContent = '';
                outputEl.textContent += finalScript;
                outputEl.scrollTop = outputEl.scrollHeight;
            }
        };

        recognition.onerror = (event) => {
            statusEl.textContent = `Error: ${event.error}`;
        };

        recognition.onend = () => {
            statusEl.textContent = "Status: Stopped";
            startBtn.disabled = false;
            stopBtn.disabled = true;
            langSelect.disabled = false;
        };

        startBtn.addEventListener('click', () => {
            recognition.lang = langSelect.value;
            recognition.start();
        });

        stopBtn.addEventListener('click', () => recognition.stop());
    }
</script>

</body>
</html>
